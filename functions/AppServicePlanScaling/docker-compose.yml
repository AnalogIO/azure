services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    # Newer Azure SDKs send storage API versions that Azurite may not know yet, that's fine for this case
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite:/data

volumes:
  azurite:
