name: Build ARM template

on:
  pull_request:
    branches: [ main ]

  workflow_call:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build ARM template
        uses: Azure/bicep-build-action@v1.0.1
        with:
          bicepFilePath: azuredeploy.bicep
          outputFilePath: azuredeploy.json

      - name: Store ARM template
        uses: actions/upload-artifact@v7
        with:
          name: arm
          path: azuredeploy.json
          retention-days: 1
          if-no-files-found: error

  build_function:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: functions/AppServicePlanScaling/global.json

      - name: Publish function app
        working-directory: functions/AppServicePlanScaling
        run: dotnet publish --configuration Release --output ${{ github.workspace }}/publish

      - name: Package function app
        working-directory: publish
        run: zip -r ../function.zip .

      - name: Store function app package
        uses: actions/upload-artifact@v7
        with:
          name: function
          path: function.zip
          retention-days: 1
          if-no-files-found: error
