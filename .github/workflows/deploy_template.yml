name: Template for deployment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: "The environment to deploy to. Can either be 'dev' or 'prd'"

jobs:
  deploy:
    name: Deploy ARM template
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.AZURE_SUBSCRIPTION_URL }}

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: arm

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_SP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ARM template
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          scope: subscription
          region: "West Europe"
          template: azuredeploy.json
          parameters: "environment=${{ inputs.environment }}"
          deploymentName: "azuredeploy-${{github.run_number}}"
          failOnStdErr: true
