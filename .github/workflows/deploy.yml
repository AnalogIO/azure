name: Azure deployment

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy_dev:
    name: Deploy to dev
    needs: [build]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy_template.yml
    secrets: inherit
    with:
      environment: dev
    concurrency:
      group: dev
      cancel-in-progress: false

  deploy_prod:
    name: Deploy to prod
    needs: [deploy_dev]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy_template.yml
    secrets: inherit
    with:
      environment: prd
    concurrency:
      group: prd
      cancel-in-progress: false
